name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -A pixel https://github.com/users/${{ github.repository_owner }}/contributions > c.html
          { grep -oE '[0-9,]+\s*contributions?\s*in the last year' c.html | tr -s ' \n' ' '; echo; grep -c 'data-level="[1-4]"' c.html; grep -oE 'Private contributions|private contributions' c.html | head -2; } > diag.txt
          git config user.name pixel-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag.txt; git commit -m diag; git push
