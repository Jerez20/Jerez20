name: avatar-tmp
on:
  push:
    branches: [avatar-tmp]
    paths: [".github/workflows/av.yml"]
jobs:
  a:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: avatar-tmp}
      - run: |
          curl -sL -o avatar.png "https://github.com/${{ github.repository_owner }}.png?size=400"
          git config user.name pixel-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add avatar.png; git commit -m avatar; git push
