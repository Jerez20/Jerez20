name: Actualizar tarjetas pixel art

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días, 6:17 a. m. en Santo Domingo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjetas
        env:
          # Si creas el secreto PROFILE_TOKEN (token personal con permiso de lectura)
          # las tarjetas también contarán tus repos privados.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          SHOW_PRIVATE_REPOS: "false"
        run: python scripts/generate.py

      - name: Guardar cambios
        run: |
          git config user.name "pixel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/debug.json 2>/dev/null || git add assets/*.svg
          git diff --cached --quiet || git commit -m "Actualizar tarjetas del perfil"
          git push
